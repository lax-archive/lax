name: Set up lax
description: >-
  Node, dependencies, and a compiled dist/ — built from the calling job's own
  checkout, or, for a read-only job that opts in, restored from the
  per-commit cache the route job saves.

# Checkout deliberately stays in the calling workflow: a local action is only
# resolvable once the repository is on disk, so every job runs its own
# actions/checkout (persist-credentials: false) before this action.
#
# The cache is a throughput convenience for read-only jobs and nothing more.
# The invariant that matters: a job that mints or holds an App token — or any
# token a sandbox escape does not already have, such as `issues: write` — runs
# only bytes it built itself from its own checkout, so the default here is no
# restore and no save. The build costs about thirteen seconds. What the cache
# must never become is a channel from the validate VM into a privileged job:
# the runner's cache token is reachable from a process that escaped the
# sandbox, and in production the route job's save is refused anyway ("cache
# write denied: token has no writable scopes" on every issue_comment run,
# history/environments-roundtrip-20260904.md), so the per-commit key stays
# unclaimed while submission code runs. An exact key with no restore-keys
# keeps a restoring job from matching anything but this commit's entry, but
# only opting out of the restore keeps a credentialed job from executing
# whatever sits under it.

inputs:
  restore:
    description: >-
      Restore node_modules and dist from this run's key instead of building.
      Only for a job whose token could do nothing a sandbox escape could not
      already do: today that is the validate job alone.
    required: false
    default: "false"
  save:
    description: >-
      Save the built tree under this run's key. Only the route job sets this:
      it precedes every other job, so nothing else can claim the key first.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: npm
    - name: Restore dependencies and the compiled tree
      id: dist-cache
      if: inputs.restore == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          node_modules
          dist
        key: lax-dist-${{ github.sha }}
    # A skipped restore leaves cache-hit empty, so every job that did not opt
    # in builds its own tree here.
    - name: Install and build
      if: steps.dist-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --ignore-scripts && npm run build
    - name: Save dependencies and the compiled tree
      if: inputs.save == 'true' && steps.dist-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          node_modules
          dist
        key: lax-dist-${{ github.sha }}
