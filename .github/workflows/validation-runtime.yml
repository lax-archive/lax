name: submission validation runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/submission-validation/**
      - src/shared/**
      - test/smoke/**
      - assets/apache-2.0.txt
      - package.json
      - package-lock.json
      - .github/workflows/validation-runtime.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: submission-validation-runtime
  cancel-in-progress: false

jobs:
  build:
    # API callers may choose an arbitrary ref for workflow_dispatch. Only main
    # is allowed to build and push a trusted validation image.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Reclaim hosted-runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Read the reviewed runtime lock
        id: pins
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const lock = JSON.parse(fs.readFileSync("src/submission-validation/runtime/validation-runtime.lock.json", "utf8"));
          const values = {
            layout_version: lock.layoutVersion,
            lean_toolchain: lock.leanToolchain,
            lean_version: lock.leanVersion,
            mathlib_repository: lock.mathlibRepository,
            mathlib_commit: lock.mathlibCommit,
            elan_commit: lock.elanCommit,
          };
          for (const [key, value] of Object.entries(values))
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`, "utf8");
          NODE
      - name: Build the pinned warm runtime
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: src/submission-validation/runtime/Containerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/submission-validation-runtime:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Lax submission validation runtime
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            LAYOUT_VERSION=${{ steps.pins.outputs.layout_version }}
            LEAN_TOOLCHAIN=${{ steps.pins.outputs.lean_toolchain }}
            LEAN_VERSION=${{ steps.pins.outputs.lean_version }}
            MATHLIB_REPOSITORY=${{ steps.pins.outputs.mathlib_repository }}
            MATHLIB_COMMIT=${{ steps.pins.outputs.mathlib_commit }}
            ELAN_COMMIT=${{ steps.pins.outputs.elan_commit }}
          cache-from: type=gha,scope=submission-validation-runtime
          cache-to: type=gha,mode=max,scope=submission-validation-runtime
      - name: Ensure the built runtime is local
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/submission-validation-runtime@${{ steps.image.outputs.digest }}
        run: |
          if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
            docker pull "$IMAGE"
          fi
      - name: Exercise the validation pipeline against the built runtime
        env:
          LAX_VALIDATION_IMAGE: ghcr.io/${{ github.repository_owner }}/submission-validation-runtime@${{ steps.image.outputs.digest }}
        run: npm run smoke:submission-validation
      - name: Record the immutable image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/submission-validation-runtime@${DIGEST}" > validation-image.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-image
          path: validation-image.txt
          retention-days: 30
