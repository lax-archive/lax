name: submission control plane

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

# Deliberately no `concurrency:` blocks anywhere in this workflow (rewrite-plan
# red-team addendum point 4): classic Actions concurrency keeps at most one
# pending run per group and cancels older pending runs, which would silently
# drop queued submissions under a burst, and the queueing semantics the
# previous groups relied on were never positively verified on GitHub's side.
# The correctness mechanism for concurrent database writes is the optimistic
# compare-and-swap loop in src/shared/archive.ts (re-read head, re-validate,
# non-forced ref update, retry on conflict). Consequence: concurrent runs on
# one issue may interleave status comments — acceptable, because every comment
# carries hidden correlation markers and readers match on those, not on order.

jobs:
  # Ordinary project issues and their comments never allocate a runner. A
  # current CLI puts the locally generated id in a hidden issue-body marker;
  # the exact old CLI body remains admitted during migration. TypeScript still
  # parses the complete marker and command under strict byte and shape limits.
  route:
    if: >-
      (github.event_name == 'issues' &&
       (startsWith(github.event.issue.body, '<!-- lax-submission-id:') ||
        github.event.issue.body == 'This issue is the control plane for one Lax submission. Keep it open and use `/lax` command comments through the CLI.')) ||
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/lax') &&
       (startsWith(github.event.issue.body, '<!-- lax-submission-id:') ||
        github.event.issue.body == 'This issue is the control plane for one Lax submission. Keep it open and use `/lax` command comments through the CLI.'))
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.route.outputs.operation }}
      action: ${{ steps.route.outputs.action }}
      validation_request: ${{ steps.route.outputs.validation_request }}
      publish_request: ${{ steps.route.outputs.publish_request }}
      context: ${{ steps.route.outputs.context }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Every job needs this one, so it is the only job that writes the shared
      # node_modules+dist cache; see the action for why the key is exact.
      - uses: ./.github/actions/setup-lax
        with:
          save: "true"
      - name: Validate and route the event
        id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Repository variables are configuration, not event input. Pin this
          # to the numeric id of the one authoritative lax repository.
          LAX_REPOSITORY_ID: ${{ vars.LAX_REPOSITORY_ID }}
        run: node dist/workflows/submission.js route

  # The one job that checks out and executes submission code. It holds only a
  # read-scoped repository token: no issue write, no packages, no actions API,
  # no App keys — everything it produces leaves as a credential-free artifact
  # that the trusted publisher re-validates before any token is minted.
  # Compile, Replay, and Inspect run sequentially inside one process on one
  # runner (rewrite-plan.md "Build pipeline"); the sandbox is the stock
  # digest-pinned Docker Hub image from src/submission-validation/pins.ts with
  # the VM-installed toolchain and warm mathlib workspace mounted read-only.
  validate:
    name: Validate
    needs: route
    if: needs.route.outputs.operation == 'validate'
    runs-on: ubuntu-latest
    # Every phase has its own cap (config.ts) and the pipeline never waits
    # on anything unbounded; this is the backstop for a hung runner, well
    # above the longest observed validation (~30 min) plus a cold image pull.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lax
      # Fetch, static validation, and dependency resolution only — seconds,
      # and no toolchain needed. A manifest typo or an unresolvable dependency
      # fails the job here instead of after a multi-GB cache restore and a
      # warm-mathlib build. The gate writes the report the upload step below
      # preserves; on a pass it leaves nothing behind and the full validation
      # re-runs these phases from scratch.
      - name: Static gate
        env:
          VALIDATION_REQUEST: ${{ needs.route.outputs.validation_request }}
          LAX_VALIDATION_OUTPUT: ${{ github.workspace }}/.build/submission-validation
        run: node dist/submission-validation/run.js --gate
      # The web derivation needs the pinned ReflowTeX checkout and its
      # hash-pinned encode venv on the runner: the compile runs in the TeX
      # container, but the encode child runs here, credential-free (an
      # anonymous public clone at the pins.ts rev — no tokens, trust rule 1
      # unchanged). Every step tolerates failure: a fetch hiccup must degrade
      # to a `web-toolchain` skip of the web view inside the validation,
      # never a failed job. The venv is saved before any submission code
      # executes, same doctrine as the lean cache below.
      - name: Restore the reflowtex encode venv
        id: reflowtex-venv-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reflowtex/venv
          key: lax-reflowtex-venv-v1-${{ runner.os }}-${{ hashFiles('reflowtex/requirements.lock') }}
      - name: Fetch the pinned ReflowTeX fork
        id: reflowtex-fetch
        continue-on-error: true
        run: npm run reflowtex:fetch
      - name: Save the reflowtex encode venv
        if: steps.reflowtex-venv-cache.outputs.cache-hit != 'true' && steps.reflowtex-fetch.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reflowtex/venv
          key: lax-reflowtex-venv-v1-${{ runner.os }}-${{ hashFiles('reflowtex/requirements.lock') }}
      # The pins module is the single home of every value the host setup
      # installs (elan commit, toolchain, mathlib revision), so its hash is
      # the cache identity; the version salt invalidates by hand when the
      # on-disk layout changes. No restore-keys: a store for other pins would
      # restore gigabytes of dead weight next to the fresh build.
      - name: Restore toolchain and warm mathlib workspace
        id: lean-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.elan
            ~/.lax/warm
            ~/.lax/tools
          key: lax-validation-host-v1-${{ runner.os }}-${{ hashFiles('src/submission-validation/pins.ts') }}
      - name: Provision the validation host
        env:
          LAX_VALIDATION_OUTPUT: ${{ github.workspace }}/.build/submission-validation
        run: node dist/submission-validation/host/setup-vm.js
      # Save before any submission code *executes*: the cache must only ever
      # hold what the trusted setup produced. Saving in the action's post step
      # would snapshot the tree after untrusted code ran on this VM — a
      # sandbox escape could poison the store for every later run. The static
      # gate above has already fetched and parsed submission bytes on this
      # host (git plus in-process node; nothing from the submission is
      # executed, and its files land in the job dir, disjoint from the cached
      # ~/.elan and ~/.lax paths), which is the accepted price of failing
      # early. Execution still begins only in the containers below, after the
      # save. This placement also keeps the expensive first build cached even
      # when the submission itself fails validation.
      - name: Save toolchain and warm mathlib workspace
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.elan
            ~/.lax/warm
            ~/.lax/tools
          key: lax-validation-host-v1-${{ runner.os }}-${{ hashFiles('src/submission-validation/pins.ts') }}
      - name: Validate
        env:
          VALIDATION_REQUEST: ${{ needs.route.outputs.validation_request }}
          LAX_VALIDATION_OUTPUT: ${{ github.workspace }}/.build/submission-validation
        run: node dist/submission-validation/run.js
      # The report alone, uploaded first and separately: it is the channel the
      # author's CLI reads (src/cli/run-artifacts.ts) and the only file the
      # failure reporter needs. Bundling it with the capture would make every
      # `lax submit` download the submission's whole build output to print a
      # finding. Same bytes, no second source of truth — the publisher still
      # revalidates the full artifact below.
      - name: Preserve the report for the CLI and the failure reporter
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: submission-validation-report-${{ github.event.issue.number }}
          path: .build/submission-validation/validation-report.json
          if-no-files-found: warn
          retention-days: 90
      # paper.pdf is present exactly when the submission declares a paper, and
      # paper-web.tar exactly when the build output records `paper.web`: the
      # publisher hashes each against the digest the build output records.
      - name: Preserve the report, generated build output, capture, paper, and profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: submission-validation-${{ github.event.issue.number }}
          path: |
            .build/submission-validation/validation-report.json
            .build/submission-validation/validation-profile.json
            .build/submission-validation/generated-build-output.json
            .build/submission-validation/capture.tar
            .build/submission-validation/paper.pdf
            .build/submission-validation/paper-web.tar
          if-no-files-found: warn
          retention-days: 90

  # The first step holds only the lax workflow token. It parses and hashes the
  # downloaded files and repeats all authorization, issue, state, stale-write,
  # and dependency checks before either App key is minted.
  #
  # Both publisher keys live in this job (deliberate, Jan 2026-08-07): the
  # Website rebuild is dispatched by whichever job owns the resulting commit,
  # so the dispatch key sits next to the database key. The invariant that
  # governs them is trust rule 1 — no job holding an App key ever checks out
  # or executes submission code. This job checks out only trusted lax source
  # and reads the validate job's artifact as data.
  #
  # Repo settings: the `lax-database-publish` environment is the one home of
  # both publisher keys, so the lax-website App id and private key must be
  # reachable from it.
  publish-submit:
    needs: [route, validate]
    if: >-
      ${{
        needs.route.outputs.operation == 'validate' &&
        needs.validate.result == 'success'
      }}
    runs-on: ubuntu-latest
    environment: lax-database-publish
    permissions:
      contents: read
      issues: write
      # The job's own GITHUB_TOKEN pushes the validated capture to ghcr
      # before the database commit references it; the App-minted database
      # token never touches the registry.
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lax
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: submission-validation-${{ github.event.issue.number }}
          path: .build/submission-validation
      - name: Parse artifacts and revalidate current state without Archive credentials
        id: prepare-submit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAX_REPOSITORY_ID: ${{ vars.LAX_REPOSITORY_ID }}
          PUBLISH_REQUEST: ${{ needs.route.outputs.publish_request }}
          VALIDATION_REPORT_PATH: ${{ github.workspace }}/.build/submission-validation/validation-report.json
          GENERATED_BUILD_OUTPUT_PATH: ${{ github.workspace }}/.build/submission-validation/generated-build-output.json
          VALIDATION_CAPTURE_PATH: ${{ github.workspace }}/.build/submission-validation/capture.tar
          VALIDATION_PAPER_PATH: ${{ github.workspace }}/.build/submission-validation/paper.pdf
          VALIDATION_PAPER_WEB_PATH: ${{ github.workspace }}/.build/submission-validation/paper-web.tar
        run: node dist/workflows/submission.js prepare-submit
      - name: Mint lax-database token
        if: steps.prepare-submit.outputs.should_publish == 'true'
        id: database-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.LAX_DATABASE_APP_ID }}
          private-key: ${{ secrets.LAX_DATABASE_APP_PRIVATE_KEY }}
          owner: lax-archive
          repositories: lax-database
          permission-administration: read
          permission-contents: write
      # Minting the dispatch token here, before publication, is what lets one
      # step publish and dispatch in one process: token actions are `actions/`
      # steps, so they cannot run inside the handler. The token can only
      # request a rebuild of lax-website from whatever lax-database holds.
      - name: Mint lax-website dispatch token
        if: steps.prepare-submit.outputs.should_publish == 'true'
        id: website-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.LAX_WEBSITE_APP_ID }}
          private-key: ${{ secrets.LAX_WEBSITE_APP_PRIVATE_KEY }}
          owner: lax-archive
          repositories: lax-website
          permission-contents: write
      - name: Promote capture, publish trusted submit, and dispatch Website
        if: steps.prepare-submit.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAX_DATABASE_TOKEN: ${{ steps.database-token.outputs.token }}
          LAX_WEBSITE_TOKEN: ${{ steps.website-token.outputs.token }}
          LAX_REPOSITORY_ID: ${{ vars.LAX_REPOSITORY_ID }}
          PUBLISH_REQUEST: ${{ needs.route.outputs.publish_request }}
          VALIDATION_REPORT_PATH: ${{ github.workspace }}/.build/submission-validation/validation-report.json
          GENERATED_BUILD_OUTPUT_PATH: ${{ github.workspace }}/.build/submission-validation/generated-build-output.json
          VALIDATION_CAPTURE_PATH: ${{ github.workspace }}/.build/submission-validation/capture.tar
          VALIDATION_PAPER_PATH: ${{ github.workspace }}/.build/submission-validation/paper.pdf
          VALIDATION_PAPER_WEB_PATH: ${{ github.workspace }}/.build/submission-validation/paper-web.tar
        run: node dist/workflows/submission.js publish-submit

  # Keep the shorter publish branch after the validation branch in declaration
  # order so GitHub's automatic DAG layout prefers it as the lower row.
  # This job checks out and executes only trusted lax source. It never checks
  # out a submission, and it holds the same two publisher keys as
  # publish-submit, for the same reason.
  publish:
    needs: route
    if: needs.route.outputs.operation == 'publish'
    runs-on: ubuntu-latest
    environment: lax-database-publish
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lax

      - name: Mint lax-database token
        id: database-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.LAX_DATABASE_APP_ID }}
          private-key: ${{ secrets.LAX_DATABASE_APP_PRIVATE_KEY }}
          owner: lax-archive
          repositories: lax-database
          permission-administration: read
          permission-contents: write

      - name: Mint lax-website dispatch token
        id: website-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.LAX_WEBSITE_APP_ID }}
          private-key: ${{ secrets.LAX_WEBSITE_APP_PRIVATE_KEY }}
          owner: lax-archive
          repositories: lax-website
          permission-contents: write

      - name: Revalidate, publish lax-database, and dispatch Website
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAX_DATABASE_TOKEN: ${{ steps.database-token.outputs.token }}
          LAX_WEBSITE_TOKEN: ${{ steps.website-token.outputs.token }}
          LAX_REPOSITORY_ID: ${{ vars.LAX_REPOSITORY_ID }}
          PUBLISH_REQUEST: ${{ needs.route.outputs.publish_request }}
        run: node dist/workflows/submission.js publish

  # The validate job's own result controls publication: run.js exits 0 only
  # after a complete pass, 2 for submission findings, and 1 when capacity or
  # infrastructure prevented a content verdict. This job reports either
  # unsuccessful outcome from the typed report. It never checks out or
  # executes submission code — it reads the report artifact as data, and the
  # artifact may be absent when validate died before writing it.
  report-validation-failure:
    needs: [route, validate]
    if: >-
      ${{
        always() &&
        needs.route.outputs.operation == 'validate' &&
        needs.validate.result == 'failure'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lax
      - name: Restore validation report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: submission-validation-report-${{ github.event.issue.number }}
          path: .build/submission-validation
      - name: Report the validation result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAX_REPOSITORY_ID: ${{ vars.LAX_REPOSITORY_ID }}
          VALIDATION_CONTEXT: ${{ needs.route.outputs.context }}
          VALIDATION_REPORT_PATH: ${{ github.workspace }}/.build/submission-validation/validation-report.json
        run: node dist/workflows/submission.js report-validation

  # TypeScript reports structured routing/publication failures. This final
  # fallback also covers failures before the handlers can run: checkout,
  # dependency installation, compilation, and App-token actions. It is a thin
  # dispatcher into the same typed, tested TS as every other job — no inline
  # JS (rewrite-plan.md "Write runner and concurrency"). Accepted tradeoff,
  # per the plan's explicit decision: a breakage in checkout/npm ci/build also
  # breaks this fallback report, in exchange for zero untyped logic in YAML.
  # A failed validate job is report-validation-failure's case, so validate is
  # not a dependency here and no double report can be posted for it.
  report-workflow-failure:
    needs:
      - route
      - publish
      - publish-submit
      - report-validation-failure
    if: >-
      ${{
        always() &&
        (needs.route.result == 'failure' ||
         needs.publish.result == 'failure' ||
         needs.publish-submit.result == 'failure' ||
         needs.report-validation-failure.result == 'failure')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lax
      - name: Post a correlated operational failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAX_REPOSITORY_ID: ${{ vars.LAX_REPOSITORY_ID }}
          ACTION: ${{ needs.route.outputs.action }}
          OPERATION: ${{ needs.route.outputs.operation }}
          # Only these two jobs can create a lax-database commit, and a job
          # that died mid-publication cannot report whether it did, so the
          # wording has to stay open about it.
          PUBLICATION_FAILED: ${{ needs.publish.result == 'failure' || needs.publish-submit.result == 'failure' }}
        run: node dist/workflows/submission.js report-failure
