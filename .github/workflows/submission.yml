name: submission control plane

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

# Deliberately no `concurrency:` blocks anywhere in this workflow (rewrite-plan
# red-team addendum point 4): classic Actions concurrency keeps at most one
# pending run per group and cancels older pending runs, which would silently
# drop queued submissions under a burst, and the queueing semantics the
# previous groups relied on were never positively verified on GitHub's side.
# The correctness mechanism for concurrent database writes is the optimistic
# compare-and-swap loop in src/shared/archive.ts (re-read head, re-validate,
# non-forced ref update, retry on conflict). Consequence: concurrent runs on
# one issue may interleave status comments — acceptable, because every comment
# carries hidden correlation markers and readers match on those, not on order.

jobs:
  # Reject unrelated issue comments before checkout or dependency installation.
  precheck:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.command.outputs.should_run }}
    steps:
      - name: Check event kind and command prefix
        id: command
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { TextDecoder } from "node:util";

          const bytes = fs.readFileSync(process.env.GITHUB_EVENT_PATH);
          const event = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes));
          const shouldRun = process.env.EVENT_NAME === "issues" ||
            (process.env.EVENT_NAME === "issue_comment" &&
              typeof event.comment?.body === "string" && event.comment.body.slice(0, 4) === "/lax");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_run=${shouldRun}\n`, "utf8");
          NODE

  route:
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.route.outputs.operation }}
      action: ${{ steps.route.outputs.action }}
      validation_request: ${{ steps.route.outputs.validation_request }}
      publish_request: ${{ steps.route.outputs.publish_request }}
      context: ${{ steps.route.outputs.context }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate and route the event
        id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Repository variables are configuration, not event input. Pin this
          # to the numeric id of the one authoritative lax repository.
          LAX_REPOSITORY_ID: ${{ vars.LAX_REPOSITORY_ID }}
        run: node dist/workflows/submission.js route

  # The one job that checks out and executes submission code. It holds only a
  # read-scoped repository token: no issue write, no packages, no actions API,
  # no App keys — everything it produces leaves as a credential-free artifact
  # that the trusted publisher re-validates before any token is minted.
  # Compile, Replay, and Inspect run sequentially inside one process on one
  # runner (rewrite-plan.md "Build pipeline"); the sandbox is the stock
  # digest-pinned Docker Hub image from src/submission-validation/pins.ts with
  # the VM-installed toolchain and warm mathlib workspace mounted read-only.
  validate:
    name: Validate
    needs: route
    if: needs.route.outputs.operation == 'validate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The pins module is the single home of every value the host setup
      # installs (elan commit, toolchain, mathlib revision), so its hash is
      # the cache identity; the version salt invalidates by hand when the
      # on-disk layout changes. No restore-keys: a store for other pins would
      # restore gigabytes of dead weight next to the fresh build.
      - name: Restore toolchain and warm mathlib workspace
        id: lean-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.elan
            ~/.lax/warm
            ~/.lax/tools
          key: lax-validation-host-v1-${{ runner.os }}-${{ hashFiles('src/submission-validation/pins.ts') }}
      - name: Provision the validation host
        env:
          LAX_VALIDATION_OUTPUT: ${{ github.workspace }}/.build/submission-validation
        run: node dist/submission-validation/host/setup-vm.js
      # Save before any submission code runs: the cache must only ever hold
      # what the trusted setup produced. Saving in the action's post step
      # would snapshot the tree after untrusted code executed on this VM —
      # a sandbox escape could poison the store for every later run. This
      # placement also keeps the expensive first build cached even when the
      # submission itself fails validation.
      - name: Save toolchain and warm mathlib workspace
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.elan
            ~/.lax/warm
            ~/.lax/tools
          key: lax-validation-host-v1-${{ runner.os }}-${{ hashFiles('src/submission-validation/pins.ts') }}
      - name: Validate
        env:
          VALIDATION_REQUEST: ${{ needs.route.outputs.validation_request }}
          LAX_VALIDATION_OUTPUT: ${{ github.workspace }}/.build/submission-validation
        run: node dist/submission-validation/run.js
      - name: Preserve the report, generated build output, capture, and profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: submission-validation-${{ github.event.issue.number }}
          path: |
            .build/submission-validation/validation-report.json
            .build/submission-validation/validation-profile.json
            .build/submission-validation/generated-build-output.json
            .build/submission-validation/capture.tar
          if-no-files-found: warn
          retention-days: 30

  # Keep success and failure handling on one visible DAG path. On failure this
  # job reports the validation result; on success it unlocks publication. It
  # never checks out or executes submission code — it only reads the artifact.
  validation-result:
    name: Validation result
    needs: [route, validate]
    if: always() && needs.route.outputs.operation == 'validate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      should_publish: ${{ steps.outcome.outputs.should_publish }}
    steps:
      # run.js exits 0 only when the full report is ok, so the job result is
      # the validation verdict; the publisher still re-parses the report.
      - name: Record validation outcome
        id: outcome
        run: >-
          echo "should_publish=${{ needs.validate.result == 'success' }}" >> "$GITHUB_OUTPUT"
      - if: steps.outcome.outputs.should_publish != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: steps.outcome.outputs.should_publish != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - if: steps.outcome.outputs.should_publish != 'true'
        run: npm ci
      - if: steps.outcome.outputs.should_publish != 'true'
        run: npm run build
      - name: Restore validation report
        if: steps.outcome.outputs.should_publish != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: submission-validation-${{ github.event.issue.number }}
          path: .build/submission-validation
      - name: Report the validation result
        if: steps.outcome.outputs.should_publish != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAX_REPOSITORY_ID: ${{ vars.LAX_REPOSITORY_ID }}
          VALIDATION_CONTEXT: ${{ needs.route.outputs.context }}
          VALIDATION_REPORT_PATH: ${{ github.workspace }}/.build/submission-validation/validation-report.json
        run: node dist/workflows/submission.js report-validation

  # The first step has only the lax workflow token. It parses and hashes the
  # downloaded files and repeats all authorization, issue, state, stale-write,
  # and dependency checks before the protected App key is used.
  publish-update:
    needs: [route, validation-result]
    if: >-
      ${{
        needs.route.outputs.operation == 'validate' &&
        needs.validation-result.outputs.should_publish == 'true'
      }}
    runs-on: ubuntu-latest
    environment: lax-database-publish
    permissions:
      contents: read
      issues: write
      # The job's own GITHUB_TOKEN pushes the validated capture to ghcr
      # before the database commit references it; the App-minted database
      # token never touches the registry.
      packages: write
    outputs:
      archive_commit: ${{ steps.publish-update.outputs.archive_commit }}
      title_sync_error: ${{ steps.publish-update.outputs.title_sync_error }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: submission-validation-${{ github.event.issue.number }}
          path: .build/submission-validation
      - name: Parse artifacts and revalidate current state without Archive credentials
        id: prepare-update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAX_REPOSITORY_ID: ${{ vars.LAX_REPOSITORY_ID }}
          PUBLISH_REQUEST: ${{ needs.route.outputs.publish_request }}
          VALIDATION_REPORT_PATH: ${{ github.workspace }}/.build/submission-validation/validation-report.json
          GENERATED_BUILD_OUTPUT_PATH: ${{ github.workspace }}/.build/submission-validation/generated-build-output.json
          VALIDATION_CAPTURE_PATH: ${{ github.workspace }}/.build/submission-validation/capture.tar
        run: node dist/workflows/submission.js prepare-update
      - name: Mint lax-database token
        if: steps.prepare-update.outputs.should_publish == 'true'
        id: database-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.LAX_DATABASE_APP_ID }}
          private-key: ${{ secrets.LAX_DATABASE_APP_PRIVATE_KEY }}
          owner: lax-archive
          repositories: lax-database
          permission-administration: read
          permission-contents: write
      - name: Promote capture and publish trusted update
        if: steps.prepare-update.outputs.should_publish == 'true'
        id: publish-update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAX_DATABASE_TOKEN: ${{ steps.database-token.outputs.token }}
          LAX_REPOSITORY_ID: ${{ vars.LAX_REPOSITORY_ID }}
          PUBLISH_REQUEST: ${{ needs.route.outputs.publish_request }}
          VALIDATION_REPORT_PATH: ${{ github.workspace }}/.build/submission-validation/validation-report.json
          GENERATED_BUILD_OUTPUT_PATH: ${{ github.workspace }}/.build/submission-validation/generated-build-output.json
          VALIDATION_CAPTURE_PATH: ${{ github.workspace }}/.build/submission-validation/capture.tar
        run: node dist/workflows/submission.js publish-update

  # Keep the shorter publish branch after the validation branch in declaration
  # order so GitHub's automatic DAG layout prefers it as the lower row.
  # This job checks out and executes only trusted lax source. It never checks
  # out a submission. The database publication environment owns only the
  # lax-database Publisher App key.
  publish:
    needs: route
    if: needs.route.outputs.operation == 'publish'
    runs-on: ubuntu-latest
    environment: lax-database-publish
    permissions:
      contents: read
      issues: write
    outputs:
      archive_commit: ${{ steps.publish.outputs.archive_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Mint lax-database token
        id: database-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.LAX_DATABASE_APP_ID }}
          private-key: ${{ secrets.LAX_DATABASE_APP_PRIVATE_KEY }}
          owner: lax-archive
          repositories: lax-database
          permission-administration: read
          permission-contents: write

      - name: Revalidate and publish lax-database
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAX_DATABASE_TOKEN: ${{ steps.database-token.outputs.token }}
          LAX_REPOSITORY_ID: ${{ vars.LAX_REPOSITORY_ID }}
          PUBLISH_REQUEST: ${{ needs.route.outputs.publish_request }}
        run: node dist/workflows/submission.js publish

  # Website credentials do not exist until lax-database has advanced. This job
  # receives no Archive token and can only dispatch the complete rebuild.
  website:
    needs: [route, publish, publish-update]
    if: >-
      ${{
        always() &&
        ((needs.publish.result == 'success' && needs.publish.outputs.archive_commit != '') ||
         (needs.publish-update.result == 'success' && needs.publish-update.outputs.archive_commit != ''))
      }}
    runs-on: ubuntu-latest
    environment: lax-website-dispatch
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Mint lax-website dispatch token
        id: website-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.LAX_WEBSITE_APP_ID }}
          private-key: ${{ secrets.LAX_WEBSITE_APP_PRIVATE_KEY }}
          owner: lax-archive
          repositories: lax-website
          permission-contents: write
      - name: Dispatch Website and report the final result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAX_WEBSITE_TOKEN: ${{ steps.website-token.outputs.token }}
          LAX_REPOSITORY_ID: ${{ vars.LAX_REPOSITORY_ID }}
          PUBLISH_REQUEST: ${{ needs.route.outputs.publish_request }}
          ARCHIVE_COMMIT: ${{ format('{0}{1}', needs.publish.outputs.archive_commit, needs.publish-update.outputs.archive_commit) }}
          TITLE_SYNC_ERROR: ${{ needs.publish-update.outputs.title_sync_error }}
        run: node dist/workflows/submission.js website

  # TypeScript reports structured routing/publication failures. This final
  # fallback also covers failures before the handlers can run: checkout,
  # dependency installation, compilation, and App-token actions. It is a thin
  # dispatcher into the same typed, tested TS as every other job — no inline
  # JS (rewrite-plan.md "Write runner and concurrency"). Accepted tradeoff,
  # per the plan's explicit decision: a breakage in checkout/npm ci/build also
  # breaks this fallback report, in exchange for zero untyped logic in YAML.
  report-workflow-failure:
    needs:
      - precheck
      - route
      - publish
      - publish-update
      - website
      - validation-result
    if: >-
      ${{
        always() &&
        (needs.precheck.result == 'failure' ||
         needs.route.result == 'failure' ||
         needs.publish.result == 'failure' ||
         needs.publish-update.result == 'failure' ||
         needs.website.result == 'failure' ||
         needs.validation-result.result == 'failure')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Post a correlated operational failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAX_REPOSITORY_ID: ${{ vars.LAX_REPOSITORY_ID }}
          ARCHIVE_COMMIT: ${{ format('{0}{1}', needs.publish.outputs.archive_commit, needs.publish-update.outputs.archive_commit) }}
          ACTION: ${{ needs.route.outputs.action }}
          OPERATION: ${{ needs.route.outputs.operation }}
          VALIDATION_RESULT: ${{ needs.validation-result.outputs.should_publish }}
        run: node dist/workflows/submission.js report-failure
