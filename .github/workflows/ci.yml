name: CI

on:
  push:
  pull_request:
  # The inspector-matrix job below is the only guard the non-epoch
  # environments have, and an environment stays open forever, so it also runs
  # on a schedule: a Lean or mathlib change that breaks an old inspector must
  # not wait for someone to touch this repository. The other jobs sit the
  # scheduled run out.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # `npm run build` compiles only what ships (tsconfig.json includes
      # src/**), so without this step nothing ever typechecks test/** or
      # scripts/**: a call that lost an argument, a fake whose shape drifted
      # from the interface it stands in for, survives until the file happens
      # to run — and a driver no suite imports never does. The typecheck
      # project covers all three trees under the same strictness and emits
      # nothing, so it runs first, ahead of the provisioning minutes below.
      - run: npm run typecheck
      - run: npm run build
      # The fast suite is docker-free but not toolchain-free: the real-lake
      # e2e tests (test/e2e/host-pipeline.test.ts and friends) drive elan/lake
      # against the fake mathlib, so the runner needs the same host toolchain
      # the smoke job provisions — same store, same key, same save-before-
      # untrusted-code rule (the suite builds fixture code with lake). The
      # store is the epoch's: setup-vm.js without --env provisions the epoch,
      # and its --cache-key names the same key the trusted validate job's
      # static gate derives for that environment, so the three workflows
      # share one store per environment.
      - name: Name the epoch's host cache key
        id: host-key
        run: node dist/submission-validation/host/setup-vm.js --cache-key
      - name: Restore toolchain and warm mathlib workspace
        id: lean-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.elan
            ~/.lax/warm
            ~/.lax/tools
          key: ${{ steps.host-key.outputs.cache_key }}
      - name: Provision the validation host
        run: node dist/submission-validation/host/setup-vm.js
      - name: Save toolchain and warm mathlib workspace
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.elan
            ~/.lax/warm
            ~/.lax/tools
          key: ${{ steps.host-key.outputs.cache_key }}
      # The proof-tree composer (assets/prooftree/) is Lean that only an
      # admitted toolchain can run, and only end to end: the smoke composes the
      # eight-theorem fixture, replays it in a fresh process, and reads the
      # kernel's own `#print axioms`. It needs no container and no mathlib, so
      # it belongs to this job, right after the provisioning it depends on —
      # and after the cache save, because it is the first step here that
      # compiles fixture code. It resolves `lean` through each environment's
      # entry rather than through PATH, which is what elan's --no-modify-path
      # install (host/setup.ts) leaves it no choice about.
      - name: Run the proof-tree composer smoke
        run: npm run smoke:prooftree
      # The paper-layer e2es compile small fixtures with the host latexmk, the
      # way `lax build` does on an author's machine; they skip themselves
      # without one, so the install is what makes them run here. Beyond the
      # pdflatex set (test/e2e/host-paper.test.ts: amsmath/amsthm/hyperref in
      # texlive-latex-base, etoolbox in texlive-latex-recommended), the web
      # derivation e2es (test/e2e/reflowtex-fork.test.ts and
      # test/e2e/paper-web.test.ts) need lualatex + luaotfload
      # (texlive-luatex), fontspec's Latin Modern OTFs (fonts-lmodern +
      # texlive-fonts-recommended), tikz (texlive-pictures), and dvisvgm with
      # the mutool PDF backend (Ubuntu 24.04's dvisvgm refuses its
      # Ghostscript, so mupdf-tools is required) — the set the reflow spike
      # measured at 313 MB / ~38 s.
      - name: Install TeX Live for the paper e2es
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended latexmk \
            texlive-luatex texlive-fonts-recommended fonts-lmodern \
            texlive-pictures dvisvgm mupdf-tools
      # The reflowtex fork e2es gate on a reference clone of the pinned
      # fork (LAX_REFLOWTEX_SOURCE) and fetch from it in their beforeAll;
      # the venv install is hash-pinned (requirements.lock) and cached on the
      # lock, so a warm run only re-clones (~seconds). The fetch runs here
      # too so a cold venv is built on its own log line.
      - name: Restore the reflowtex encode venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reflowtex/venv
          key: lax-reflowtex-venv-v1-${{ runner.os }}-${{ hashFiles('reflowtex/requirements.lock') }}
      - name: Fetch the pinned ReflowTeX fork
        run: |
          pins="$(cat src/submission-validation/pins.ts)"
          url="$(node -p "process.argv[1].match(/REFLOWTEX_URL = \"([^\"]+)\"/)[1]" "$pins")"
          rev="$(node -p "process.argv[1].match(/REFLOWTEX_REV = \"([0-9a-f]{40})\"/)[1]" "$pins")"
          git clone --quiet "$url" "$RUNNER_TEMP/reflowtex-fork"
          git -C "$RUNNER_TEMP/reflowtex-fork" fetch --quiet origin "$rev"
          echo "LAX_REFLOWTEX_SOURCE=$RUNNER_TEMP/reflowtex-fork" >> "$GITHUB_ENV"
          npm run reflowtex:fetch
      - run: npm test

  # `npm run check` cannot see the container-only seam: it builds on the host,
  # in place, and never provisions a fresh workspace from a read-only capture.
  # The 2026-08-06 live rehearsal (history/live-rehearsal.md) lost a production
  # round trip to exactly that blind spot — installOwnConceptCapture omitted the
  # `build/ir` companions, which the docker smoke reproduces and the unit+host
  # suite does not. So the smoke is a gate, not a habit: it runs here on every
  # push, in a real container, against the real pins.
  smoke:
    name: Container smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Rehearsal timings: cold provision ≈ 170 s of hosted-runner job time, the
    # six fixtures ≈ 3.2 min locally. The ceiling is generous for a cold,
    # cache-missing 2-core runner while still killing a hung container.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The `paper-web` fixture drives the trusted web derivation, whose
      # host-side encode runs over the fetched ReflowTeX fork (the same
      # fetch the validate job performs); without it the fixture can only
      # report a `web-toolchain` skip, which the smoke asserts against.
      - name: Restore the reflowtex encode venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reflowtex/venv
          key: lax-reflowtex-venv-v1-${{ runner.os }}-${{ hashFiles('reflowtex/requirements.lock') }}
      - name: Fetch the pinned ReflowTeX fork
        run: npm run reflowtex:fetch
      # Same store, same identity, same rules as submission.yml's validate job
      # for the epoch: the key is derived by host/setup.ts from the environment
      # table's row (id, mathlib commit, inspector sources under its
      # toolchain), and no restore-keys — a store for other pins would restore
      # gigabytes of dead weight next to the fresh build. Sharing the key with
      # the trusted workflow is deliberate: both jobs write it only from
      # trusted provisioning, before any sandbox runs (see below).
      - name: Name the epoch's host cache key
        id: host-key
        run: node dist/submission-validation/host/setup-vm.js --cache-key
      - name: Restore toolchain and warm mathlib workspace
        id: lean-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.elan
            ~/.lax/warm
            ~/.lax/tools
          key: ${{ steps.host-key.outputs.cache_key }}
      # The smoke calls ensureValidationHost itself, but only after this step
      # has already done the work — provisioning here keeps the expensive part
      # on its own log line and, crucially, in front of the cache save.
      - name: Provision the validation host
        run: node dist/submission-validation/host/setup-vm.js
      # Save before the smoke executes any fixture inside a container: the cache
      # must only ever hold what trusted setup produced, and this key is shared
      # with the trusted validate job. Saving in the action's post step would
      # snapshot the VM after sandboxed builds ran on it. It also keeps the
      # expensive first build cached when a fixture assertion fails.
      - name: Save toolchain and warm mathlib workspace
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.elan
            ~/.lax/warm
            ~/.lax/tools
          key: ${{ steps.host-key.outputs.cache_key }}
      # Deliberately no env: no fake-mathlib seam (the smoke refuses to start
      # with one set — it must assert the real pins) and no validation output
      # directory; the fixtures get throwaway job roots under $TMPDIR.
      - name: Run the real-container submission validation smoke
        run: npm run smoke:submission-validation

  # Which environments the inspector still has to build for, and whether this
  # event needs asking. The check job installs the epoch alone, so between
  # admissions every other admitted environment's inspector is unguarded — and
  # an environment stays open forever (environments-plan.md, "Islands"), so a
  # release that breaks an old one has to surface here rather than in a
  # validation run. The matrix comes from the table's own source text, so this
  # job needs no npm install and no build, and an unreadable table fails loudly
  # instead of yielding a short matrix that silently stops guarding a row.
  inspector-plan:
    name: Plan the inspector matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # the push's parent has to be in this clone to diff against
          fetch-depth: 0
      - id: decide
        env:
          # Event values are untrusted (trust rule 2): they reach the script
          # through the environment, never through an expression the shell
          # would then parse.
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          matrix="$(node scripts/environments/matrix.mjs)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A push whose parent this clone does not have — a new branch, a
          # force push, the first commit — cannot be compared, so it runs. The
          # gate errs towards running: a skipped guard is worse than a spent
          # runner minute.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Eq \
            '^(src/submission-validation/lean/|assets/prooftree/|src/submission-validation/environments\.ts$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # One leg per admitted environment: install its toolchain (no mathlib — 3 GB
  # and about a minute), build the inspector its entry names, and compare the
  # golden report. The shape guards in lean/inspector/Main.lean fail the build
  # itself when a persisted extension entry type has moved, so this job catches
  # drift as a compile error rather than as a wrong report.
  inspector-matrix:
    name: Inspector (${{ matrix.id }})
    needs: inspector-plan
    if: needs.inspector-plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      # every environment is reported, not just the first to break
      fail-fast: false
      matrix: ${{ fromJSON(needs.inspector-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # install-toolchain.mjs reaches into dist/ for the pinned elan installer
      - run: npm run build
      - name: Install the environment's toolchain
        env:
          LEAN_TOOLCHAIN: ${{ matrix.leanToolchain }}
        run: node scripts/environments/install-toolchain.mjs "$LEAN_TOOLCHAIN"
      # The golden test builds the inspector for, and compares against, every
      # admitted environment whose toolchain is installed — and this leg
      # installed exactly one.
      - name: Build the inspector and compare the golden report
        run: npx vitest run test/e2e/inspector-golden.test.ts
      # The composer shares the same "one source, every environment" exposure
      # and no test but this one covers it (spike/environments/REPORT.md: the
      # unit and fake-mathlib e2e suites passed straight through the 4.33
      # break). It needs no mathlib either.
      - name: Run the proof-tree composer smoke
        run: npm run smoke:prooftree
