name = "axiomfree"
version = "0.1.0"
# `lake check` builds the default targets: the archive content (spec-2 concepts
# and proofs). Challenge/Solution are built by name by `lake comparator`.
defaultTargets = ["Concepts", "Proofs"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "Concepts"

[[lean_lib]]
name = "Proofs"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

# --- appended after the first build (tasks 3 negative tests, 4, 5) ---
[[lean_lib]]
name = "SolutionDefeq"

[[lean_lib]]
name = "SolutionSorry"

[[lean_lib]]
name = "ConceptsShadow"

[[lean_lib]]
name = "SolutionShadow"

[[lean_lib]]
name = "SolutionShadowBoth"

[[lean_lib]]
name = "Concepts1"

[[lean_lib]]
name = "Challenge1"

[[lean_lib]]
name = "Solution1"

[[lean_lib]]
name = "Solution1Ax"

[[lean_lib]]
name = "ModTest"
roots = ["ModTest.Hidden", "ModTest.UseModule", "ModTest.UseLegacy"]

[[lean_lib]]
name = "NoHeader"
